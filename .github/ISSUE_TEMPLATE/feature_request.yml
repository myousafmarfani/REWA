name: Feature request
description: Propose a new feature or a meaningful enhancement.
title: "[feat] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea — but read this first.

        rewa is developed spec-first against the approved architecture in
        `MEMORY.md`, `AGENTS.md`, and `specs/`. The scope is deliberately
        narrow: WhatsApp only, and the autonomous agent is the product.

        A feature request is most useful when it:

        - Fixes a correctness, compliance, or data-isolation problem.
        - Improves the autonomous agent's ability to handle real
          conversations without inventing property facts.
        - Fits the current delivery models (managed or white-label
          single-tenant), not a deferred public multi-tenant SaaS.

        Read [CONTRIBUTING.md](https://github.com/myousafmarfani/REWA/blob/main/CONTRIBUTING.md)
        before proposing implementation work.

  - type: textarea
    id: problem
    attributes:
      label: What's the problem?
      description: What are you trying to do today that rewa makes harder than it should?
      placeholder: |
        When a broadcast ends I have no way to see which recipients
        didn't reply so I can follow up manually.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: Describe the feature from the user's perspective, not the implementation.
      placeholder: |
        On the broadcast detail page, a "No reply" filter that lists
        recipients who received but didn't reply within 24 hours.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Things that kinda work today, workarounds, related features in other tools.
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      description: Your guess — we'll re-scope if needed.
      options:
        - Small (a couple of hours)
        - Medium (a couple of days)
        - Large (a couple of weeks, probably breaks into multiple PRs)
    validations:
      required: false
